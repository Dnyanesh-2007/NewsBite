<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | News Bite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <a href="index.html" class="team-logo" style="display:block; text-align:center; margin-bottom:12px;">News Bite</a>

            <form id="login-form">
                <h2>Login</h2>
                <label for="login-email">Email</label>
                <input id="login-email" type="email" required>
                <label for="login-password">Password</label>
                <input id="login-password" type="password" minlength="6" required>
                <button type="submit" class="auth-btn">Login</button>
                <p class="auth-switch">New here? <a href="#" id="show-signup">Sign up</a></p>
            </form>

            <form id="signup-form" class="hidden">
                <h2>Sign Up</h2>
                <label for="signup-name">Name</label>
                <input id="signup-name" type="text" required>
                <label for="signup-email">Email</label>
                <input id="signup-email" type="email" required>
                <label for="signup-password">Password</label>
                <input id="signup-password" type="password" minlength="6" required>
                <button type="submit" class="auth-btn">Create account</button>
                <p class="auth-switch">Already have an account? <a href="#" id="show-login">Login</a></p>
            </form>

            <p id="auth-message" class="auth-message"></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="login.js"></script>
</body>
</html>
